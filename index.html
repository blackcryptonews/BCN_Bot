<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BlackCryptoNews AI - Institutional-grade crypto intelligence terminal">
    <title>BlackCryptoNews AI Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        /* BCN Official Typography Stack */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');

        /* ==========================================
           BCN DESIGN SYSTEM - FINALIZED SPEC
           Visual alignment with: Stripe, Notion, Bloomberg
        ========================================== */

        :root {
            /* Primary Colors */
            --onyx: #050505;
            --electric-purple: #BD00FF;
            --cyber-blue: #00F0FF;
            
            /* Accents */
            --gold: #FFD700;
            --soft-silver: #C8C8C8;
            
            /* Functional Colors */
            --success: #00FF88;
            --warning: #FFB800;
            --error: #FF3366;
            
            /* Opacity Variants */
            --purple-glow: rgba(189, 0, 255, 0.3);
            --blue-glow: rgba(0, 240, 255, 0.3);
            --gold-glow: rgba(255, 215, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #050505 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--soft-silver);
            overflow: hidden;
        }

        /* Typography System */
        .font-headline {
            font-family: 'Space Grotesk', sans-serif;
        }

        .font-data {
            font-family: 'Orbitron', monospace;
        }

        .font-body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Scrollbar - Premium */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(5, 5, 5, 0.5);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--electric-purple), var(--cyber-blue));
            border-radius: 5px;
            border: 2px solid var(--onyx);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--cyber-blue), var(--electric-purple));
        }

        /* Hide scrollbar for agent menu */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Premium Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        /* Premium Glow Effects */
        .glow-purple {
            text-shadow: 0 0 20px var(--purple-glow), 0 0 40px var(--purple-glow);
        }

        .glow-blue {
            text-shadow: 0 0 20px var(--blue-glow), 0 0 40px var(--blue-glow);
        }

        .glow-gold {
            text-shadow: 0 0 20px var(--gold-glow), 0 0 40px var(--gold-glow);
        }

        .border-glow-purple {
            box-shadow: 0 0 20px var(--purple-glow), inset 0 0 20px rgba(189, 0, 255, 0.1);
        }

        .border-glow-blue {
            box-shadow: 0 0 20px var(--blue-glow), inset 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .border-glow-gold {
            box-shadow: 0 0 20px var(--gold-glow), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        /* Agent Button Premium Styling */
        .agent-btn {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(20px);
        }

        .agent-btn:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .agent-btn.active {
            background: linear-gradient(135deg, rgba(189, 0, 255, 0.2), rgba(0, 240, 255, 0.2));
            border-color: var(--electric-purple);
        }

        .agent-btn.active::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--electric-purple), var(--cyber-blue));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
        }

        /* Premium Animations */
        @keyframes pulse-border-premium {
            0%, 100% { 
                border-color: var(--electric-purple);
                box-shadow: 0 0 20px var(--purple-glow);
            }
            50% { 
                border-color: var(--cyber-blue);
                box-shadow: 0 0 30px var(--blue-glow);
            }
        }

        .animate-border-premium {
            animation: pulse-border-premium 3s ease-in-out infinite;
        }

        /* Ticker Premium Styling */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: linear-gradient(90deg, 
                rgba(5, 5, 5, 0.98) 0%, 
                rgba(10, 10, 10, 0.95) 50%, 
                rgba(5, 5, 5, 0.98) 100%
            );
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(189, 0, 255, 0.3);
            box-shadow: 0 2px 20px rgba(189, 0, 255, 0.1);
        }
        
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 50s linear infinite;
        }
        
        .ticker-item {
            display: inline-block;
            padding: 0 3rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Premium Message Bubbles */
        .msg-user {
            background: linear-gradient(135deg, 
                rgba(189, 0, 255, 0.15), 
                rgba(189, 0, 255, 0.05)
            );
            border-left: 3px solid var(--electric-purple);
            backdrop-filter: blur(20px);
        }
        
        .msg-bot {
            background: linear-gradient(135deg, 
                rgba(0, 240, 255, 0.08), 
                rgba(255, 255, 255, 0.03)
            );
            border-left: 3px solid var(--cyber-blue);
            backdrop-filter: blur(20px);
        }

        /* Fade In Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Premium Gradient Border */
        .gradient-border {
            position: relative;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, var(--electric-purple), var(--cyber-blue), var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        /* Loading Dots Premium */
        @keyframes loadingDots {
            0%, 20% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        .loading-dot {
            animation: loadingDots 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Premium Glass Effect */
        .glass-premium {
            background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Price Colors */
        .price-up {
            color: var(--success);
        }
        
        .price-down {
            color: var(--error);
        }

        /* Status Pulse Premium */
        @keyframes pulse-premium {
            0%, 100% { 
                opacity: 1; 
                box-shadow: 0 0 10px var(--purple-glow);
            }
            50% { 
                opacity: 0.5; 
                box-shadow: 0 0 20px var(--purple-glow);
            }
        }

        .status-pulse {
            animation: pulse-premium 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Input Focus Premium */
        #userInput:focus {
            box-shadow: 0 0 0 2px rgba(189, 0, 255, 0.3), 
                        0 0 30px rgba(189, 0, 255, 0.2),
                        inset 0 0 20px rgba(0, 240, 255, 0.1);
            border-color: var(--electric-purple);
        }

        /* Code Block Premium */
        .code-block {
            background: rgba(5, 5, 5, 0.8);
            border: 1px solid rgba(189, 0, 255, 0.3);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        /* Premium Logo Glow */
        .logo-container {
            position: relative;
            background: linear-gradient(135deg, var(--electric-purple), var(--cyber-blue));
            box-shadow: 0 0 30px var(--purple-glow), 0 0 50px var(--blue-glow);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .ticker-item {
                padding: 0 1.5rem;
                font-size: 0.75rem;
            }
            
            .agent-btn {
                min-width: 75px;
            }
        }

        /* Tooltip Premium */
        .tooltip {
            position: relative;
        }

        .tooltip::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, rgba(189, 0, 255, 0.95), rgba(0, 240, 255, 0.95));
            color: white;
            border: 1px solid var(--electric-purple);
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 20px var(--purple-glow);
        }

        .tooltip:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">

    <!-- Premium Scanline Overlay -->
    <div class="scanlines"></div>

    <!-- Premium Crypto Ticker -->
    <div class="ticker-wrap h-12 flex items-center z-40">
        <div class="ticker text-sm font-data" id="cryptoTicker">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <!-- Main Terminal Container -->
    <div class="flex-1 flex flex-col relative z-10 overflow-hidden">
        
        <!-- Premium Header -->
        <header class="p-4 flex justify-between items-center border-b border-purple-900/30 glass-premium">
            <div class="flex items-center gap-3">
                <!-- BCN Premium Logo -->
                <div class="logo-container w-12 h-12 rounded-xl flex items-center justify-center border-2 border-purple-500 relative overflow-hidden">
                    <span class="font-headline font-bold text-white text-2xl z-10 relative">B</span>
                    <div class="absolute inset-0 bg-gradient-to-br from-transparent to-black/50"></div>
                </div>
                <div>
                    <h1 class="text-3xl font-headline font-bold tracking-tight text-white glow-purple">
                        BCN <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 text-base align-top font-data">AI</span>
                    </h1>
                    <p class="text-[10px] text-soft-silver/60 font-data tracking-[0.2em] uppercase font-medium">
                        Institutional Intelligence Terminal
                    </p>
                </div>
            </div>
            
            <!-- Premium Status Indicator -->
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full glass-premium border border-purple-500/30">
                    <div class="h-2 w-2 rounded-full bg-purple-500 status-pulse"></div>
                    <span class="text-xs text-purple-300 font-data uppercase tracking-wider font-semibold">Live</span>
                </div>
                <button id="settingsBtn" class="p-2 rounded-lg hover:bg-white/5 transition-all duration-300 tooltip border-glow-purple" data-tooltip="Settings">
                    <i class="fas fa-cog text-soft-silver/60 text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Chat Messages Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 pb-40 scroll-smooth">
            <!-- Welcome Message -->
            <div class="flex gap-3 mb-6 animate-fade-in-up">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500/20 to-cyan-500/20 flex items-center justify-center border border-purple-500/40 flex-shrink-0 border-glow-purple">
                    <i class="fas fa-brain text-purple-400"></i>
                </div>
                <div class="msg-bot p-4 rounded-r-2xl rounded-bl-2xl max-w-[90%] sm:max-w-[85%] text-sm leading-relaxed text-soft-silver shadow-2xl border border-white/10">
                    <p class="mb-3 font-headline"><strong class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 text-base">⚡ Welcome to BCN Intelligence Terminal</strong></p>
                    <p class="mb-2 font-body">I am your institutional-grade crypto intelligence system with real-time market analysis capabilities.</p>
                    <p class="text-soft-silver/60 text-xs mt-3 font-body">
                        <span class="text-purple-400 font-data">→</span> Select an agent below or type a command to begin
                    </p>
                </div>
            </div>
        </div>

        <!-- Premium Input Controls & Agent Menu -->
        <div class="absolute bottom-0 w-full bg-gradient-to-t from-black via-black/95 to-transparent pt-12 pb-4 px-4 z-20 border-t border-purple-900/20">
            
            <!-- Premium Agent Selection Menu -->
            <div class="flex gap-3 overflow-x-auto pb-4 mb-3 no-scrollbar">
                <button onclick="activateAgent('general')" class="agent-btn group flex flex-col items-center min-w-[90px] p-3 rounded-xl border-2 border-purple-900/50 glass-premium transition-all duration-300 hover:border-purple-500 active" id="agent-general">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500/20 to-purple-900/20 flex items-center justify-center mb-2 group-hover:from-purple-500/30 group-hover:to-purple-900/30 transition-all border border-purple-500/30">
                        <i class="fas fa-brain text-purple-400 text-base"></i>
                    </div>
                    <span class="text-[11px] text-soft-silver uppercase tracking-wider font-data font-semibold group-hover:text-purple-300">General</span>
                </button>

                <button onclick="activateAgent('whale')" class="agent-btn group flex flex-col items-center min-w-[90px] p-3 rounded-xl border-2 border-cyan-900/50 glass-premium transition-all duration-300 hover:border-cyan-500" id="agent-whale">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-cyan-900/20 flex items-center justify-center mb-2 group-hover:from-cyan-500/30 group-hover:to-cyan-900/30 transition-all border border-cyan-500/30">
                        <i class="fas fa-water text-cyan-400 text-base"></i>
                    </div>
                    <span class="text-[11px] text-soft-silver uppercase tracking-wider font-data font-semibold group-hover:text-cyan-300">Whale</span>
                </button>

                <button onclick="activateAgent('technician')" class="agent-btn group flex flex-col items-center min-w-[90px] p-3 rounded-xl border-2 border-blue-900/50 glass-premium transition-all duration-300 hover:border-blue-500" id="agent-technician">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500/20 to-blue-900/20 flex items-center justify-center mb-2 group-hover:from-blue-500/30 group-hover:to-blue-900/30 transition-all border border-blue-500/30">
                        <i class="fas fa-chart-line text-blue-400 text-base"></i>
                    </div>
                    <span class="text-[11px] text-soft-silver uppercase tracking-wider font-data font-semibold group-hover:text-blue-300">Charts</span>
                </button>

                <button onclick="activateAgent('sherlock')" class="agent-btn group flex flex-col items-center min-w-[90px] p-3 rounded-xl border-2 border-yellow-900/50 glass-premium transition-all duration-300 hover:border-yellow-500" id="agent-sherlock">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-500/20 to-yellow-900/20 flex items-center justify-center mb-2 group-hover:from-yellow-500/30 group-hover:to-yellow-900/30 transition-all border border-yellow-500/30">
                        <i class="fas fa-search-dollar text-yellow-400 text-base"></i>
                    </div>
                    <span class="text-[11px] text-soft-silver uppercase tracking-wider font-data font-semibold group-hover:text-yellow-300">Alpha</span>
                </button>

                <button onclick="activateAgent('news')" class="agent-btn group flex flex-col items-center min-w-[90px] p-3 rounded-xl border-2 border-red-900/50 glass-premium transition-all duration-300 hover:border-red-500" id="agent-news">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500/20 to-red-900/20 flex items-center justify-center mb-2 group-hover:from-red-500/30 group-hover:to-red-900/30 transition-all border border-red-500/30">
                        <i class="fas fa-newspaper text-red-400 text-base"></i>
                    </div>
                    <span class="text-[11px] text-soft-silver uppercase tracking-wider font-data font-semibold group-hover:text-red-300">News</span>
                </button>

                <button onclick="activateAgent('defi')" class="agent-btn group flex flex-col items-center min-w-[90px] p-3 rounded-xl border-2 border-green-900/50 glass-premium transition-all duration-300 hover:border-green-500" id="agent-defi">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500/20 to-green-900/20 flex items-center justify-center mb-2 group-hover:from-green-500/30 group-hover:to-green-900/30 transition-all border border-green-500/30">
                        <i class="fas fa-coins text-green-400 text-base"></i>
                    </div>
                    <span class="text-[11px] text-soft-silver uppercase tracking-wider font-data font-semibold group-hover:text-green-300">DeFi</span>
                </button>
            </div>

            <!-- Premium Input Area -->
            <div class="relative max-w-4xl mx-auto gradient-border rounded-xl">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none z-10">
                    <span class="text-purple-400 font-data text-base font-bold">❯</span>
                </div>
                <input 
                    type="text" 
                    id="userInput" 
                    class="w-full glass-premium border-2 border-purple-900/50 text-white rounded-xl pl-10 pr-14 py-4 focus:outline-none font-body text-sm placeholder-soft-silver/40 shadow-2xl transition-all duration-300 relative z-10"
                    placeholder="Enter command (e.g., /price BTC, analyze ETH, latest news)..." 
                    autocomplete="off"
                    spellcheck="false"
                >
                <button onclick="sendMessage()" class="absolute inset-y-0 right-0 pr-3 flex items-center group z-10">
                    <div class="p-2.5 rounded-lg hover:bg-white/5 text-purple-400 transition-all duration-300 group-hover:scale-110 group-hover:text-cyan-400">
                        <i class="fas fa-paper-plane text-base"></i>
                    </div>
                </button>
            </div>
            
            <!-- Premium Footer Info -->
            <div class="text-center mt-3">
                <p class="text-[10px] text-soft-silver/40 font-data tracking-wider">
                    BCN AI v3.5.0 <span class="text-soft-silver/30">•</span> SECURE CONNECTION <span class="text-purple-400">✓</span>
                </p>
            </div>
        </div>
    </div>

    <script src="bcn-ai-terminal.js"></script>
</body>
</html>
